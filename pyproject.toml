[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-risk-monitor"
version = "0.1.0"
description = "Out-of-band monitor that scores each action of an autonomous coding agent before it runs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
riskmon = "riskmon.__main__:main"

[tool.setuptools]
packages = ["riskmon"]

[tool.setuptools.package-data]
riskmon = ["dashboard.html", "default_policy.json"]
